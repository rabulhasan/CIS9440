version: 2
sources:
  - name: raw
    description: Raw data loaded from NYC Open Data
    database: rabiulhasan-cis-9440-g2
    schema: nyc_hw3_raw_data 
    tables:
      - name: source_dot_service_requests_history
        description: |
          NYC 311 service requests for Dept of Transportation.
          One row per service request.
        columns:
          - name: unique_key
            description: Unique ID for the service request
            tests:
              - unique
              - not_null
          - name: created_date
            description: Date and time the request was created
          - name: closed_date
            description: Date and time the request was closed
          - name: agency
            description: Agency code
          - name: agency_name
            description: Full name of the agency
          - name: complaint_type
            description: Type of complaint
          - name: descriptor
            description: Further description of the complaint
          - name: descriptor_2
            description: Additional description of the complaint
          - name: location_type
            description: Location where the incident occurred
          - name: incident_zip
            description: Zip code of the incident location
          - name: incident_address
            description: Street address of the incident
          - name: latitude
            description: Latitude coordinate
          - name: longitude
            description: Longitude coordinate
          - name: address_type
            description: 'Type of address (e.g., ADDRESS, INTERSECTION, BLOCKFACE)'
          - name: bbl
            description: Borough Block and Lot number (NYC tax lot id)
          - name: borough
            description: NYC borough where incident occurred
          - name: bridge_highway_direction
            description: Direction on bridge or highway (e.g. Northbound)
          - name: bridge_highway_name
            description: Name of bridge or highway where incident occurred
          - name: bridge_highway_segment
            description: Specific segment of bridge or highway
          - name: city
            description: City name where incident occurred
          - name: community_board
            description: NYC Community Board district number
          - name: cross_street_1
            description: First cross street near incident location
          - name: cross_street_2
            description: Second cross street near incident location
          - name: due_date
            description: Expected due date for request resolution
          - name: facility_type
            description: Type of facility where incident occurred
          - name: intersection_street_1
            description: First street forming intersection where incident occurred
          - name: intersection_street_2
            description: Second street forming intersection where incident occurred
          - name: open_data_channel_type
            description: How request was submitted (ONLINE, PHONE, MOBILE, etc.)
          - name: park_borough
            description: Borough of park where incident occurred
          - name: park_facility_name
            description: Name of park facility where incident occurred
          - name: resolution_action_updated_date
            description: Date when resolution action was last updated
          - name: resolution_description
            description: Description of how the request was resolved
          - name: road_ramp
            description: Road ramp identifier where incident occurred
          - name: status
            description: Current status of request (Open, Closed, In Progress, etc.)
          - name: street_name
            description: Name of street where incident occurred
          - name: x_coordinate_state_plane
            description: X coordinate in NY State Plane projection system (NAD 83)
          - name: y_coordinate_state_plane
            description: Y coordinate in NY State Plane projection system (NAD 83)
          - name: landmark
            description: Nearby landmark or point of interest



      - name: source_nyc_open_restaurant_apps
        description: |
          NYC Open Restaurant Applications.
          One row per service request.
        columns:
          - name:	approved_for_roadway_seating
            description: This column indicates whether the application was approved for roadway seating.
          - name:	approved_for_sidewalk_seating
            description: This column indicates whether the application was approved for sidewalk seating.
          - name:	bbl
            description: This column contains the Borough, Block, and Lot number for the property.
          - name:	bin
            description: This column contains the Building Identification Number for the property.
          - name:	borough
            description: This column specifies the borough where the restaurant is located.
          - name:	bulding_number
            description: This column holds the building number of the restaurant's address.
          - name:	business_address
            description: This column contains the full business address of the restaurant.
          - name:	census_tract
            description: This column provides the census tract identifier for the restaurant's location.
          - name:	community_board
            description: This column indicates the community board district for the restaurant.
          - name:	council_district
            description: This column specifies the council district for the restaurant's location.
          - name:	doing_business_as_dba
            description: This column contains the "Doing Business As" name of the restaurant.
          - name:	food_service_establishment
            description: This column indicates if the establishment is a food service establishment.
          - name:	globalid
            description: This column holds a globally unique identifier for the record.
            tests:
              - unique
              - not_null
          - name:	healthcompliance_terms
            description: This column contains information related to health compliance terms.
          - name:	landmark_district_or_building
            description: This column indicates if the location is within a landmark district or is a landmark building.
          - name:	landmarkdistrict_terms
            description: This column contains information related to landmark district terms.
          - name:	latitude
            description: This column stores the latitude coordinate of the restaurant's location.
          - name:	legal_business_name
            description: This column contains the legal business name of the restaurant.
          - name:	longitude
            description: This column stores the longitude coordinate of the restaurant's location.
          - name:	nta
            description: This column provides the Neighborhood Tabulation Area for the restaurant's location.
          - name:	objectid
            description: This column holds a unique object identifier for the record.
          - name:	qualify_alcohol
            description: This column indicates if the establishment qualifies for alcohol service.
          - name:	restaurant_name
            description: This column contains the name of the restaurant.
          - name:	roadway_dimensions_area
            description: This column specifies the area of the proposed roadway seating.
          - name:	roadway_dimensions_length
            description: This column specifies the length of the proposed roadway seating.
          - name:	roadway_dimensions_width
            description: This column specifies the width of the proposed roadway seating.
          - name:	seating_interest_sidewalk
            description: This column indicates interest in sidewalk seating.
          - name:	sidewalk_dimensions_area
            description: This column specifies the area of the proposed sidewalk seating.
          - name:	sidewalk_dimensions_length
            description: This column specifies the length of the proposed sidewalk seating.
          - name:	sidewalk_dimensions_width
            description: This column specifies the width of the proposed sidewalk seating.
          - name:	sla_license_type
            description: This column contains the type of State Liquor Authority license.
          - name:	sla_serial_number
            description: This column contains the serial number of the State Liquor Authority license.
          - name:	street
            description: This column holds the street name of the restaurant's address.
          - name:	time_of_submission
            description: This column contains the timestamp of when the application was submitted.
          - name:	zip
            description: This column contains the zip code of the restaurant's address.



